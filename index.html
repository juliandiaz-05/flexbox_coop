<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Creación de Proyecto y sus archivos</title>
</head>
<body>
    <!-- ── COMPONENTE 10 · SIDEBAR ── -->
  <div class="separador">
    <div class="separador__linea">Componente 10</div>
    Sidebar · Barra Lateral de Navegación
  </div>

  <div class="vista-previa">
    <aside class="barra-lateral">

      <div class="barra-lateral__encabezado">
        <span class="barra-lateral__logo">Bella Notte</span>
        <span class="barra-lateral__subtitulo">Ristorante Italiano</span>
      </div>

      <nav class="barra-lateral__navegacion">
        <a class="barra-lateral__item barra-lateral__item--activo" href="#">
          <span class="barra-lateral__icono">🍝</span>
          <span class="barra-lateral__etiqueta">Il Menù</span>
        </a>
        <a class="barra-lateral__item" href="#">
          <span class="barra-lateral__icono">🍷</span>
          <span class="barra-lateral__etiqueta">Carta de Vinos</span>
        </a>
        <a class="barra-lateral__item" href="#">
          <span class="barra-lateral__icono">📅</span>
          <span class="barra-lateral__etiqueta">Reservaciones</span>
          <span class="barra-lateral__badge">3</span>
        </a>
        <a class="barra-lateral__item" href="#">
          <span class="barra-lateral__icono">📸</span>
          <span class="barra-lateral__etiqueta">Galería</span>
        </a>
        <a class="barra-lateral__item" href="#">
          <span class="barra-lateral__icono">⭐</span>
          <span class="barra-lateral__etiqueta">Nuestra Historia</span>
        </a>
        <a class="barra-lateral__item" href="#">
          <span class="barra-lateral__icono">📍</span>
          <span class="barra-lateral__etiqueta">Ubicación</span>
        </a>
        <a class="barra-lateral__item" href="#">
          <span class="barra-lateral__icono">🎁</span>
          <span class="barra-lateral__etiqueta">Eventos Privados</span>
        </a>
      </nav>

      <div class="barra-lateral__pie">
        <button class="barra-lateral__boton-reserva" type="button">Hacer Reservación</button>
      </div>
    </aside>

    <main class="zona-contenido">
      <span class="zona-contenido__flecha">←</span>
      <p>Selecciona una sección en el menú lateral</p>
    </main>
  </div>
</body>
</html>
